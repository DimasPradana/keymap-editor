name: Deploy to Pages
on:
  push:
    branches: [main]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: cd app && npm install && npm run build:production
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          REACT_APP_APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          REACT_APP_GITHUB_APP_NAME: ${{ secrets.GITHUB_APP_NAME }}
          REACT_APP_ENABLE_GITHUB: 'true'
          REACT_APP_ENABLE_LOCAL: 'true'
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/build
          publish_branch: pages
